name: Fetch Polymarket Top Trader Data

on:
  schedule:
    # Runs every 6 hours (at minute 0 of hours 0, 6, 12, 18 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to commit back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Polymarket script
        run: python main.py

      - name: Commit and Push JSON update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add polymarket_top_traders_trades.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Polymarket trader data" && git push)
